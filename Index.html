<div class="app">

<main class="content">

      </button>

    <button class="bg-choice" style="background:#6b4bb3" onclick="setAppBg('#6b4bb3')">Бунафш</button>

<div class="modal" id="modal" onclick="if(event.target===this) closeModal()">
<div class="sheet" onclick="event.stopPropagation()">
<div class="modal-head"><h2>Илова кардани бино</h2><button class="modal-close-x" onclick="closeModal()">×</button></div>
<div class="field"><label>Номи бино *</label><input id="name" placeholder="Масалан: Бинои марказӣ"></div>
<div class="field"><label>Рақами бино *</label><input id="number" placeholder="Масалан: 01"></div>
<div class="field"><label>Суроға *</label><input id="address" placeholder="Масалан: Душанбе, кӯчаи Сомонӣ 12"></div>
<div class="field"><label>Шумораи ҳуҷраҳо *</label><input id="rooms" type="number" placeholder="Масалан: 24"></div>
<button class="save" onclick="saveBuilding()">✓ Сабт кардан</button>
<button class="cancel" onclick="closeModal()">Бекор кардан</button>
</div>
</div>

<script>
let buildings=[
{name:"Бинои марказӣ",number:"01",address:"Душанбе, кӯчаи Сомонӣ 12",rooms:24}
];

let pageStack=[];

function render(){
 const q=(document.getElementById('search')?.value||'').toLowerCase();
 const data=buildings.filter(b=>(b.name+" "+b.number+" "+b.address).toLowerCase().includes(q));
 const count=document.getElementById('count');
 const list=document.getElementById('list');
 if(count)count.textContent=buildings.length;
 if(list)list.innerHTML=data.map(b=>`
 <div class="card"><div class="pic">🏢</div><div class="info">
 <h3>${b.name}</h3><p>${b.address}</p><p>🏠 ${b.rooms} ҳуҷра</p>
 </div><div class="arrow">›</div></div>`).join('');
}

function lockBackground(){ document.body.classList.add('modal-locked'); }

function unlockBackground(){
 const ids=['settingsModal','backgroundModal','modal','nameModal'];
 const anyOpen=ids.some(id=>document.getElementById(id)?.classList.contains('show'));
 const menuOpen=document.getElementById('sideMenu')?.classList.contains('open');
 if(!anyOpen && !menuOpen)document.body.classList.remove('modal-locked');
}

function hideAllModals(){
 ['settingsModal','backgroundModal','modal','nameModal'].forEach(id=>{
   const e=document.getElementById(id); if(e)e.classList.remove('show');
 });
}

function openModalById(id){
 hideAllModals();
 const e=document.getElementById(id);
 if(e){e.classList.add('show');lockBackground();}
}

function openSettings(){
 const menu=document.getElementById('sideMenu'), overlay=document.getElementById('overlay');
 menu?.classList.remove('open'); overlay?.classList.remove('show');
 pageStack=[];
 openModalById('settingsModal');
}

function closeSettings(){
 hideAllModals();
 pageStack=[];
 unlockBackground();
}

function openBackgroundSettings(){
 pageStack.push('settingsModal');
 openModalById('backgroundModal');
}

function closeBackgroundSettings(){
 const previous=pageStack.pop()||'settingsModal';
 openModalById(previous);
}

function openNameSettings(){
 const n=document.getElementById('appNameInput');
 const s=document.getElementById('appSubtitleInput');
 if(n)n.value=localStorage.getItem('appName')||'ТАНЗИМИ БИНО';
 if(s)s.value=localStorage.getItem('appSubtitle')||'Беҳтар, осон, барои шумо';
 pageStack.push('settingsModal');
 openModalById('nameModal');
}

function closeNameSettings(){
 const previous=pageStack.pop()||'settingsModal';
 openModalById(previous);
}

function saveNameSettings(){
 const n=(document.getElementById('appNameInput')?.value||'').trim()||'ТАНЗИМИ БИНО';
 const s=(document.getElementById('appSubtitleInput')?.value||'').trim()||'Беҳтар, осон, барои шумо';
 localStorage.setItem('appName',n);
 localStorage.setItem('appSubtitle',s);
 applySavedSettings();
 closeNameSettings();
}

function applySavedSettings(){
 const n=localStorage.getItem('appName')||'ТАНЗИМИ БИНО';
 const s=localStorage.getItem('appSubtitle')||'Беҳтар, осон, барои шумо';
 const title=document.querySelector('.header h1');
 const subtitle=document.querySelector('.header p');
 if(title)title.textContent='🏢 '+n;
 if(subtitle)subtitle.textContent=s;
}

function restoreAppName(){ applySavedSettings(); }
function restoreAppSubtitle(){ applySavedSettings(); }
function restoreTitleColor(){}

function openBuildingFromSettings(){
 pageStack.push('settingsModal');
 openModalById('modal');
}

function openModal(){
 pageStack=[];
 openModalById('modal');
}

function closeModal(){
 const previous=pageStack.pop();
 if(previous){
  hideAllModals();
  openModalById(previous);
  return;
 }
 hideAllModals();
 unlockBackground();
}

function saveBuilding(){
 const name=document.getElementById('name').value.trim();
 const number=document.getElementById('number').value.trim();
 const address=document.getElementById('address').value.trim();
 const rooms=document.getElementById('rooms').value;
 if(!name||!number||!address||!rooms){alert("Ҳамаи майдонҳоро пур кунед.");return}
 buildings.push({name,number,address,rooms});
 ["name","number","address","rooms"].forEach(id=>document.getElementById(id).value="");
 closeModal();render();
}

function toggleMenu(){
 const m=document.getElementById('sideMenu'), o=document.getElementById('overlay');
 const opening=!m.classList.contains('open');
 m.classList.toggle('open');o.classList.toggle('show');
 if(opening)lockBackground();else unlockBackground();
}

function updateDates(){
 const d=new Date();
 const s=String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear();
 const a=document.getElementById('mainDate'), b=document.getElementById('settingsDate');
 if(a)a.textContent=s;if(b)b.textContent=s;
}

function restoreAppBackground(){
 const img=localStorage.getItem('appBgImage'), color=localStorage.getItem('appBg');
 const h=document.querySelector('.header');
 if(!h)return;
 if(img){h.style.backgroundImage=`url("${img}")`;h.style.backgroundSize='cover';h.style.backgroundPosition='center';}
 else if(color){h.style.backgroundImage='none';h.style.backgroundColor=color;}
  if(color){const bottom=document.querySelector('.bottom'); if(bottom)bottom.style.background=color;}
}

function setAppBg(color){
 const h=document.querySelector('.header');
 if(h){h.style.backgroundImage='none';h.style.backgroundColor=color;}
 localStorage.setItem('appBg',color);
 localStorage.removeItem('appBgImage');
}

function setAppPicture(event){
 const file=event.target.files[0];if(!file)return;
 const reader=new FileReader();
 reader.onload=function(e){
  const h=document.querySelector('.header');
  h.style.backgroundImage=`url("${e.target.result}")`;
  h.style.backgroundSize='cover';h.style.backgroundPosition='center';
  localStorage.setItem('appBgImage',e.target.result);
  localStorage.removeItem('appBg');
 };
 reader.readAsDataURL(file);
}

document.getElementById('search')?.addEventListener('input',render);
restoreAppBackground();
restoreAppName();
updateDates();
setInterval(updateDates,60000);
render();
</script>

      document.getElementById('addBuildingModal').classList.remove('show');

<script>
(function(){
 const oldBg=window.setAppBg;
 window.setAppBg=function(color){
   if(typeof oldBg==="function") oldBg(color);
   document.documentElement.style.setProperty("--app-bottom-bg",color);
   localStorage.setItem("appBottomBg",color);
 };
 const oldPic=window.setAppPicture;
 window.setAppPicture=function(event){
   if(typeof oldPic==="function") oldPic(event);
   setTimeout(function(){
     const img=localStorage.getItem("appBgImage");
     if(img){document.documentElement.style.setProperty("--app-bottom-bg","url(\""+img+"\") center/cover no-repeat");}
   },50);
 };
 const saved=localStorage.getItem("appBottomBg")||localStorage.getItem("appBg");
 if(saved) document.documentElement.style.setProperty("--app-bottom-bg",saved);
})();
</script>
