<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Танзими Бино — Вход</title>
<style>
*{box-sizing:border-box}
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f3f4f6}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}
.card{width:min(430px,100%);background:#fff;border:1px solid #e5e7eb;border-radius:24px;padding:28px;box-shadow:0 18px 50px rgba(17,24,39,.10)}
.logo{width:64px;height:64px;border-radius:18px;background:#111827;color:#fff;display:grid;place-items:center;font-size:30px;margin:0 auto 16px}
h1{text-align:center;margin:0;font-size:25px}
.sub{text-align:center;color:#6b7280;margin:8px 0 26px}
label{display:block;font-weight:600;font-size:14px;margin:16px 0 7px}
input,select{width:100%;height:50px;border:1px solid #d1d5db;border-radius:12px;padding:0 14px;font-size:16px;background:#fff;outline:none}
input:focus,select:focus{border-color:#111827;box-shadow:0 0 0 3px rgba(17,24,39,.08)}
.password{position:relative}.password input{padding-right:52px}
.eye{position:absolute;right:8px;top:7px;width:38px;height:36px;border:0;background:transparent;border-radius:9px;cursor:pointer}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:15px 0}
.check{display:flex;align-items:center;gap:8px;font-size:14px;color:#4b5563}
.check input{width:17px;height:17px}
.link{border:0;background:none;padding:0;color:#2563eb;cursor:pointer;font-size:14px}
button.primary{width:100%;height:52px;border:0;border-radius:13px;background:#111827;color:#fff;font-weight:700;font-size:16px;cursor:pointer}
button.primary:disabled{opacity:.55;cursor:wait}
.status{min-height:24px;margin:12px 0 0;text-align:center;font-size:14px}
.secondary{width:100%;height:48px;margin-top:10px;border:1px solid #d1d5db;border-radius:13px;background:#fff;color:#111827;font-weight:700;font-size:15px;cursor:pointer}
.demo{margin-top:20px;padding:12px;border-radius:12px;background:#f9fafb;color:#6b7280;font-size:12px;text-align:center}
.modal{position:fixed;inset:0;background:rgba(17,24,39,.45);display:grid;place-items:center;padding:18px;z-index:10}
.modal-card{width:min(430px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:22px;padding:24px;box-shadow:0 25px 70px rgba(0,0,0,.2)}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.modal-head h2{margin:0;font-size:21px}
.close{border:0;background:#f3f4f6;border-radius:10px;width:38px;height:38px;font-size:20px;cursor:pointer}
.terms{display:flex;gap:8px;align-items:flex-start;margin:15px 0;font-size:13px;color:#4b5563}
.terms input{width:17px;height:17px;flex:0 0 auto}
.success{color:#047857}.error{color:#b91c1c}
.hidden{display:none}
</style>
</head>
<body>
<main class="card">
  <div class="logo" aria-hidden="true">🏢</div>
  <h1>Танзими Бино</h1>
  <p class="sub">Система управления домами</p>

  <form id="loginForm" novalidate>
    <label for="login">Логин или номер телефона</label>
    <input id="login" name="login" autocomplete="username" placeholder="Введите логин или номер телефона">

    <label for="password">Пароль</label>
    <div class="password">
      <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Введите пароль">
      <button class="eye" id="togglePassword" type="button" aria-label="Показать пароль">👁</button>
    </div>

    <label for="role">Тип пользователя</label>
    <select id="role" name="role">
      <option value="admin">Администратор</option>
      <option value="employee">Сотрудник</option>
      <option value="resident">Жилец</option>
    </select>

    <div class="row">
      <label class="check"><input type="checkbox" id="remember"> Запомнить меня</label>
      <button class="link" type="button" id="forgot">Забыли пароль?</button>
    </div>

    <button class="primary" id="submit" type="submit">Войти</button>
    <button class="secondary" id="registerOpen" type="button">Регистрация</button>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </form>

  <div class="demo">
    ДЕМО-ВЕРСИЯ · настоящие пароли здесь не сохраняются.
  </div>
</main>

<div class="modal hidden" id="registerModal" aria-hidden="true">
  <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="registerTitle">
    <div class="modal-head">
      <h2 id="registerTitle">Регистрация</h2>
      <button class="close" id="registerClose" type="button" aria-label="Закрыть">×</button>
    </div>
    <p class="sub" style="text-align:left;margin-bottom:10px">Создайте аккаунт сотрудника или жильца.</p>

    <form id="registerForm" novalidate>
      <label for="regName">Имя и фамилия</label>
      <input id="regName" placeholder="Введите имя и фамилию" autocomplete="name">

      <label for="regPhone">Номер телефона</label>
      <input id="regPhone" type="tel" placeholder="+992 XX XXX XX XX" autocomplete="tel">

      <label for="regLogin">Логин</label>
      <input id="regLogin" placeholder="Придумайте логин" autocomplete="username">

      <label for="regPassword">Пароль</label>
      <input id="regPassword" type="password" placeholder="Не менее 8 символов" autocomplete="new-password">

      <label for="regPassword2">Повторите пароль</label>
      <input id="regPassword2" type="password" placeholder="Повторите пароль" autocomplete="new-password">

      <label for="regRole">Тип аккаунта</label>
      <select id="regRole">
        <option value="employee">Сотрудник</option>
        <option value="resident">Жилец</option>
      </select>

      <label class="terms">
        <input id="regTerms" type="checkbox">
        <span>Я согласен с правилами использования системы.</span>
      </label>

      <button class="primary" id="registerSubmit" type="submit">Зарегистрироваться</button>
      <div class="status" id="registerStatus" role="status" aria-live="polite"></div>
    </form>
  </section>
</div>

<script>
const form = document.getElementById('loginForm');
const password = document.getElementById('password');
const toggle = document.getElementById('togglePassword');
const submit = document.getElementById('submit');
const status = document.getElementById('status');

function validateLogin(data){
  const errors = [];
  if(!data.login.trim()) errors.push('Введите логин или номер телефона.');
  if(!data.password) errors.push('Введите пароль.');
  return {valid: errors.length === 0, errors};
}

function demoLogin(data){
  // Только UI-прототип: реальные учетные данные не проверяются и не сохраняются.
  return {ok:true, role:data.role};
}

toggle.addEventListener('click', () => {
  const visible = password.type === 'text';
  password.type = visible ? 'password' : 'text';
  toggle.setAttribute('aria-label', visible ? 'Показать пароль' : 'Скрыть пароль');
});

const registerModal = document.getElementById('registerModal');
const registerForm = document.getElementById('registerForm');
const registerStatus = document.getElementById('registerStatus');

document.getElementById('registerOpen').addEventListener('click', () => {
  registerModal.classList.remove('hidden');
  registerModal.setAttribute('aria-hidden', 'false');
  document.getElementById('regName').focus();
});
document.getElementById('registerClose').addEventListener('click', () => {
  registerModal.classList.add('hidden');
  registerModal.setAttribute('aria-hidden', 'true');
});
registerModal.addEventListener('click', (e) => {
  if(e.target === registerModal) document.getElementById('registerClose').click();
});

registerForm.addEventListener('submit', (e) => {
  e.preventDefault();
  const name = document.getElementById('regName').value.trim();
  const phone = document.getElementById('regPhone').value.trim();
  const login = document.getElementById('regLogin').value.trim();
  const pass = document.getElementById('regPassword').value;
  const pass2 = document.getElementById('regPassword2').value;
  const terms = document.getElementById('regTerms').checked;

  const errors = [];
  if(!name) errors.push('Введите имя и фамилию.');
  if(!phone) errors.push('Введите номер телефона.');
  if(!login) errors.push('Введите логин.');
  if(pass.length < 8) errors.push('Пароль должен содержать минимум 8 символов.');
  if(pass !== pass2) errors.push('Пароли не совпадают.');
  if(!terms) errors.push('Необходимо принять правила.');

  if(errors.length){
    registerStatus.className = 'status error';
    registerStatus.textContent = errors[0];
    return;
  }

  registerStatus.className = 'status success';
  registerStatus.textContent = 'Заявка на регистрацию создана. Подтверждение номера подключим к серверу.';
  registerForm.reset();
});

document.getElementById('forgot').addEventListener('click', () => {
  status.className = 'status';
  status.textContent = 'Восстановление пароля подключим к защищённому серверу на следующем этапе.';
});

form.addEventListener('submit', (event) => {
  event.preventDefault();
  status.className = 'status';
  const data = {
    login: document.getElementById('login').value,
    password: password.value,
    role: document.getElementById('role').value
  };
  const validation = validateLogin(data);
  if(!validation.valid){
    status.className = 'status error';
    status.textContent = validation.errors.join(' ');
    return;
  }

  submit.disabled = true;
  submit.textContent = 'Вход...';

  setTimeout(() => {
    const result = demoLogin(data);
    const roleNames = {admin:'Администратор', employee:'Сотрудник', resident:'Жилец'};
    status.className = 'status success';
    status.textContent = `Демо-вход выполнен: ${roleNames[result.role]}.`;
    submit.disabled = false;
    submit.textContent = 'Войти';
    password.value = '';
  }, 450);
});
</script>
</body>
</html>
